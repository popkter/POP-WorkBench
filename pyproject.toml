[build-system]
requires = ["setuptools>=79", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poptools"
version = "1.1.7"
description = "A self-contained Material 3 desktop toolbox for Android development and log analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6-Essentials==6.11.1",
  "PySide6-Addons==6.11.1",
  "av>=16.1,<17",
  "platformdirs>=4.4,<5",
  "pydantic>=2.12,<3",
  "pypinyin>=0.55,<1",
  "psutil>=7,<8",
  "requests>=2.28,<3",
  "setuptools>=65,<70",
  "wexpect>=4,<5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "aqtinstall>=3.3,<4",
  "cmake>=3.21,<4",
  "mypy>=1.18",
  "Pillow>=12,<13",
  "pyinstaller>=6.16",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-qt>=4.5,<5",
  "ruff>=0.14",
]

[project.scripts]
poptools = "poptools.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poptools = [
  "ui/qml/**/*.qml",
  "ui/qml/theme/configs/*.json",
  "native/*",
  "resources/vendor/*",
  "ui/qml/**/qmldir",
  "resources/tools/*.json",
  "resources/tools/*.py",
  "resources/tools/*.ps1",
  "resources/python/*.py",
  "resources/fonts/*",
  "resources/help/*.json",
  "resources/icons/*",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["poptools"]
